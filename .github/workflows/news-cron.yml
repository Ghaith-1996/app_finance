name: News Cron

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-cron
  cancel-in-progress: false

jobs:
  trigger-news-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Validate CRON_ENDPOINT format
        run: |
          set -euo pipefail
          if [[ "${CRON_ENDPOINT}" != */api/news/cron ]]; then
            echo "CRON_ENDPOINT must end with /api/news/cron, got: ${CRON_ENDPOINT}"
            exit 1
          fi
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}

      - name: Run ingest worker and finalize
        id: ingest
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -euo pipefail

          for name in CRON_ENDPOINT CRON_SECRET NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "${name} secret is not set"
              exit 1
            fi
          done

          payload_file="$(mktemp)"
          response_file="$(mktemp)"

          python -m workers.news_ingestion.cron_runner > "${payload_file}"
          python -m json.tool "${payload_file}" > /dev/null

          echo "Cron payload summary:"
          python3 - "$payload_file" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          sources = {
              key: data.get(key, {})
              for key in ("edgar", "newsapi", "gnews", "finnhub")
          }
          source_summary = {
              key: {
                  "fetched": row.get("fetched", 0),
                  "inserted": row.get("inserted", 0),
                  "skipped": row.get("skipped", 0),
                  "failed": row.get("failed", 0),
              }
              for key, row in sources.items()
              if isinstance(row, dict)
          }
          print(
              "tickers=%s lookbackHours=%s maxArticles=%s totalInserted=%s sources=%s"
              % (
                  len(data.get("tickers", [])),
                  data.get("lookbackHours", "?"),
                  data.get("maxArticles", "?"),
                  data.get("total_inserted", "?"),
                  json.dumps(source_summary, sort_keys=True),
              )
          )
          PY

          http_code="$(
            curl -sS \
              -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data-binary "@${payload_file}" \
              -o "${response_file}" \
              -w "%{http_code}" \
              "${CRON_ENDPOINT}"
          )"

          echo "HTTP ${http_code}"
          echo "Cron response summary:"
          python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              data = json.load(open(sys.argv[1]))
          except Exception:
              print("non-json response")
              raise SystemExit(0)

          print(
              "totalInserted=%s insertedArticleIds=%s shouldEnrich=%s"
              % (
                  data.get("totalInserted", "?"),
                  len(data.get("insertedArticleIds", [])),
                  data.get("shouldEnrich", False),
              )
          )
          if data.get("error"):
              print("error=%s" % data["error"])
          PY

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "News cron invocation failed"
            exit 1
          fi

          article_ids="$(python3 - "$response_file" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          ids = data.get("insertedArticleIds", [])
          print(json.dumps(ids))
          PY
          )"
          should_enrich="$(python3 - "$response_file" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          print("true" if data.get("shouldEnrich", False) else "false")
          PY
          )"

          echo "article_ids=${article_ids}" >> "$GITHUB_OUTPUT"
          echo "should_enrich=${should_enrich}" >> "$GITHUB_OUTPUT"

      # Audit J1: the steps below run even when this run inserted nothing or an earlier step failed.
      # Enrichment drains the durable enrichment_status backlog, so articles inserted by a run that
      # crashed before enrichment are recovered by the next run without new upstream articles.
      - name: Drain enrichment backlog
        if: ${{ !cancelled() }}
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          ENRICH_URL="${CRON_ENDPOINT}/enrich"
          echo "Draining enrichment backlog via ${ENRICH_URL}"

          python3 - "$ENRICH_URL" <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time

          enrich_url = sys.argv[1]
          cron_secret = os.environ["CRON_SECRET"]
          max_batches = 30
          # Articles are enriched one AI call at a time and a call may take up to 60 s
          # (AI_REQUEST_TIMEOUT_MS), so 3 per batch fits the 230 s wait, itself under Vercel's 300 s.
          batch_size = 3
          # Leave the job's 35 minutes to extraction and analysis; the backlog continues next run.
          deadline = time.monotonic() + 12 * 60
          # Groq's free tier allows 8K tokens/minute and a batch of 3 uses ~5K, so batches start a
          # minute apart; otherwise its per-minute limit pushes articles onto the Nemotron fallback.
          batch_interval = 60
          totals = {"enriched": 0, "retrying": 0, "failed": 0, "skipped": 0}
          remaining = None
          last_start = None

          for i in range(max_batches):
              if last_start is not None:
                  time.sleep(max(0, batch_interval - (time.monotonic() - last_start)))
              if time.monotonic() > deadline:
                  print(f'Drain time budget reached after {i} batch(es); the backlog continues next run.')
                  break
              last_start = time.monotonic()
              try:
                  result = subprocess.run([
                      'curl', '-sS', '--max-time', '230',
                      '-X', 'POST',
                      '-H', f'Authorization: Bearer {cron_secret}',
                      '-H', 'Content-Type: application/json',
                      '-H', 'Accept: application/json',
                      '-d', json.dumps({'backlog': True, 'limit': batch_size}),
                      '-w', '\n%{http_code}',
                      enrich_url
                  ], capture_output=True, text=True, timeout=240)
              except subprocess.TimeoutExpired:
                  result = None

              lines = result.stdout.strip().rsplit('\n', 1) if result else ['']
              body = lines[0] if len(lines) > 1 else ''
              http_code = lines[-1].strip()
              try:
                  resp = json.loads(body)
              except json.JSONDecodeError:
                  resp = {}

              if not http_code.isdigit() or not (200 <= int(http_code) < 300) or resp.get('error'):
                  curl_error = result.stderr.strip() if result else 'no response before the timeout'
                  print(f'Enrich batch {i+1} failed: HTTP {http_code or "000"} error={resp.get("error")}' + (f' curl={curl_error}' if curl_error else ''))
                  if not http_code.isdigit() or http_code == '000':
                      print('A batch that timed out may still finish on Vercel; its articles are retried with backoff.')
                  print(f'Totals so far: {json.dumps(totals)}')
                  sys.exit(1)

              for key in totals:
                  totals[key] += int(resp.get(key, 0))
              remaining = int(resp.get('remaining', 0))
              processed = sum(int(resp.get(key, 0)) for key in totals)
              print(f'Batch {i+1}: {json.dumps({k: resp.get(k) for k in totals})} remaining={remaining}')

              if remaining == 0 or processed == 0:
                  break

          print(f'Enrichment totals: {json.dumps(totals)} remaining_due={remaining}')
          if totals['retrying'] or totals['failed']:
              print('Some articles hit AI failures; they stay queued with backoff (failed = attempts exhausted).')
          PY

      - name: Extract full text (new and queued articles)
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTICLE_IDS: ${{ steps.ingest.outputs.article_ids }}
        run: |
          set -euo pipefail

          ID_CSV="$(printf '%s' "${ARTICLE_IDS:-[]}" | python3 -c 'import json,sys; print(",".join(json.loads(sys.stdin.read() or "[]")))')"

          if [ -n "${ID_CSV}" ]; then
            echo "Extracting full text for new articles"
            python -m workers.news_ingestion.extract_full_text --ids "${ID_CSV}"
          fi

          echo "Extracting rows left queued by earlier runs"
          python -m workers.news_ingestion.extract_full_text --queued --limit 40
          echo "Full text extraction completed"

      - name: Fetch portfolios that need analysis
        if: ${{ !cancelled() }}
        id: analysis_targets
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${CRON_ENDPOINT%/api/news/cron}"
          ANALYSIS_URL="${BASE_URL}/api/analysis/cron"

          # No force: the route selects portfolios without a usable run, or with articles enriched
          # since their last usable run, outside the cooldown.
          echo "Fetching portfolios that need analysis via ${ANALYSIS_URL}"

          response_file="$(mktemp)"

          http_code="$(
            curl -sS \
              -X GET \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Accept: application/json" \
              -o "${response_file}" \
              -w "%{http_code}" \
              "${ANALYSIS_URL}"
          )"

          echo "HTTP ${http_code}"

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "Analysis target discovery failed"
            error_detail="$(python3 -c 'import json, sys; data = json.load(open(sys.argv[1])); print(data.get("error", "unknown"))' "$response_file" 2>/dev/null || printf '%s' '(non-JSON response)')"
            echo "error: ${error_detail}"
            exit 1
          fi

          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print("Eligible portfolios: %d, in cooldown: %s, already up to date: %s" % (len(d.get("portfolioIds", [])), d.get("skippedCount", 0), d.get("upToDateCount", 0)))' "$response_file"

          portfolio_ids="$(python3 -c 'import json, sys; print(json.dumps(json.load(open(sys.argv[1])).get("portfolioIds", [])))' "$response_file")"
          echo "portfolio_ids=${portfolio_ids}" >> "$GITHUB_OUTPUT"

      - name: Run portfolio analysis per portfolio
        if: ${{ !cancelled() && steps.analysis_targets.outcome == 'success' }}
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTFOLIO_IDS: ${{ steps.analysis_targets.outputs.portfolio_ids }}
        run: |
          set -euo pipefail

          BASE_URL="${CRON_ENDPOINT%/api/news/cron}"
          ANALYSIS_URL="${BASE_URL}/api/analysis/cron"

          echo "Running portfolio analysis via ${ANALYSIS_URL}"

          python3 - "$ANALYSIS_URL" <<'PY'
          import json
          import os
          import subprocess
          import sys

          portfolio_ids = json.loads(os.environ.get("PORTFOLIO_IDS") or "[]")
          analysis_url = sys.argv[1]
          cron_secret = os.environ["CRON_SECRET"]
          print(f'Processing {len(portfolio_ids)} portfolio(s) sequentially')

          # One failing portfolio must not prevent the remaining portfolios from running (audit J1).
          failures = []
          processed = skipped = 0
          for i, portfolio_id in enumerate(portfolio_ids):
              print(f'--- Portfolio {i+1}/{len(portfolio_ids)}: {portfolio_id} ---')
              payload = json.dumps({'portfolioId': portfolio_id, 'force': True})

              try:
                  result = subprocess.run([
                      'curl', '-sS',
                      '-X', 'POST',
                      '-H', f'Authorization: Bearer {cron_secret}',
                      '-H', 'Content-Type: application/json',
                      '-H', 'Accept: application/json',
                      '-d', payload,
                      '-w', '\n%{http_code}',
                      analysis_url
                  ], capture_output=True, text=True, timeout=300)
              except subprocess.TimeoutExpired:
                  failures.append((portfolio_id, 'timeout'))
                  continue

              lines = result.stdout.strip().rsplit('\n', 1)
              body = lines[0] if len(lines) > 1 else ''
              http_code = lines[-1].strip()
              print(f'HTTP {http_code}')

              if not http_code.isdigit() or not (200 <= int(http_code) < 300):
                  failures.append((portfolio_id, f'HTTP {http_code}'))
                  continue

              try:
                  resp = json.loads(body)
              except json.JSONDecodeError:
                  failures.append((portfolio_id, 'invalid JSON'))
                  continue

              if resp.get('error'):
                  failures.append((portfolio_id, resp['error']))
                  continue

              if resp.get('skipped'):
                  skipped += 1
                  print(f'Portfolio {portfolio_id} skipped ({resp.get("code") or "cooldown"})')
              else:
                  processed += 1
                  print(f'Portfolio {portfolio_id} processed successfully')

          print(f'Analysis summary: processed={processed} skipped={skipped} failed={len(failures)}')
          for portfolio_id, reason in failures:
              print(f'  FAILED {portfolio_id}: {reason}')
          if failures:
              sys.exit(1)
          PY
