name: News Cron

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-news-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ingest worker and finalize production news cron
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -euo pipefail

          for name in CRON_ENDPOINT CRON_SECRET NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "${name} secret is not set"
              exit 1
            fi
          done

          payload_file="$(mktemp)"
          response_file="$(mktemp)"

          python -m workers.news_ingestion.cron_runner > "${payload_file}"
          python -m json.tool "${payload_file}" > /dev/null

          echo "Cron payload:"
          cat "${payload_file}"

          http_code="$(
            curl -sS \
              -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data-binary "@${payload_file}" \
              -o "${response_file}" \
              -w "%{http_code}" \
              "${CRON_ENDPOINT}"
          )"

          echo "HTTP ${http_code}"
          cat "${response_file}"

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "News cron invocation failed"
            exit 1
          fi
