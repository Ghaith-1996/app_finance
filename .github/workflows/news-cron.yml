name: News Cron

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-cron
  cancel-in-progress: false

jobs:
  trigger-news-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate CRON_ENDPOINT format
        run: |
          set -euo pipefail
          if [[ "${CRON_ENDPOINT}" != */api/news/cron ]]; then
            echo "CRON_ENDPOINT must end with /api/news/cron, got: ${CRON_ENDPOINT}"
            exit 1
          fi
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}

      - name: Run ingest worker and finalize
        id: ingest
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -euo pipefail

          for name in CRON_ENDPOINT CRON_SECRET NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "${name} secret is not set"
              exit 1
            fi
          done

          payload_file="$(mktemp)"
          response_file="$(mktemp)"

          python -m workers.news_ingestion.cron_runner > "${payload_file}"
          python -m json.tool "${payload_file}" > /dev/null

          echo "Cron payload summary:"
          python3 - "$payload_file" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          sources = {
              key: data.get(key, {})
              for key in ("edgar", "newsapi", "gnews", "finnhub")
          }
          source_summary = {
              key: {
                  "fetched": row.get("fetched", 0),
                  "inserted": row.get("inserted", 0),
                  "skipped": row.get("skipped", 0),
                  "failed": row.get("failed", 0),
              }
              for key, row in sources.items()
              if isinstance(row, dict)
          }
          print(
              "tickers=%s lookbackHours=%s maxArticles=%s totalInserted=%s sources=%s"
              % (
                  len(data.get("tickers", [])),
                  data.get("lookbackHours", "?"),
                  data.get("maxArticles", "?"),
                  data.get("total_inserted", "?"),
                  json.dumps(source_summary, sort_keys=True),
              )
          )
          PY

          http_code="$(
            curl -sS \
              -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data-binary "@${payload_file}" \
              -o "${response_file}" \
              -w "%{http_code}" \
              "${CRON_ENDPOINT}"
          )"

          echo "HTTP ${http_code}"
          echo "Cron response summary:"
          python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              data = json.load(open(sys.argv[1]))
          except Exception:
              print("non-json response")
              raise SystemExit(0)

          print(
              "totalInserted=%s insertedArticleIds=%s shouldEnrich=%s"
              % (
                  data.get("totalInserted", "?"),
                  len(data.get("insertedArticleIds", [])),
                  data.get("shouldEnrich", False),
              )
          )
          if data.get("error"):
              print("error=%s" % data["error"])
          PY

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "News cron invocation failed"
            exit 1
          fi

          article_ids="$(python3 - "$response_file" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          ids = data.get("insertedArticleIds", [])
          print(json.dumps(ids))
          PY
          )"
          should_enrich="$(python3 - "$response_file" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          print("true" if data.get("shouldEnrich", False) else "false")
          PY
          )"

          echo "article_ids=${article_ids}" >> "$GITHUB_OUTPUT"
          echo "should_enrich=${should_enrich}" >> "$GITHUB_OUTPUT"

      - name: Enrich articles in batches
        if: steps.ingest.outputs.should_enrich == 'true'
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          ENRICH_URL="${CRON_ENDPOINT}/enrich"
          ARTICLE_IDS='${{ steps.ingest.outputs.article_ids }}'

          echo "Enriching articles via ${ENRICH_URL}"
          echo "Total article IDs: $(echo "${ARTICLE_IDS}" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"

          python3 - "$ARTICLE_IDS" "$ENRICH_URL" <<'PY'
          import json
          import os
          import subprocess
          import sys

          ids = json.loads(sys.argv[1])
          enrich_url = sys.argv[2]
          cron_secret = os.environ["CRON_SECRET"]
          batch_size = 10
          batches = [ids[i:i+batch_size] for i in range(0, len(ids), batch_size)]

          print(f'Processing {len(ids)} article(s) in {len(batches)} batch(es)')

          failed = False
          for i, batch in enumerate(batches):
              print(f'--- Batch {i+1}/{len(batches)}: {len(batch)} article(s) ---')
              payload = json.dumps({'articleIds': batch})

              result = subprocess.run([
                  'curl', '-sS',
                  '-X', 'POST',
                  '-H', f'Authorization: Bearer {cron_secret}',
                  '-H', 'Content-Type: application/json',
                  '-H', 'Accept: application/json',
                  '-d', payload,
                  '-w', '\n%{http_code}',
                  enrich_url
              ], capture_output=True, text=True, timeout=120)

              lines = result.stdout.strip().rsplit('\n', 1)
              body = lines[0] if len(lines) > 1 else ''
              http_code = lines[-1].strip()

              print(f'HTTP {http_code}')

              if not (200 <= int(http_code) < 300):
                  print(f'Enrich batch {i+1} failed with HTTP {http_code}')
                  failed = True
                  break

              try:
                  resp = json.loads(body)
                  if resp.get('error'):
                      print(f'Enrich batch {i+1} returned error: {resp["error"]}')
                      failed = True
                      break
                  print(f'  enriched={resp.get("enriched", "?")}, skipped={resp.get("skipped", "?")}')
              except json.JSONDecodeError:
                  print(f'Enrich batch {i+1} returned invalid JSON')
                  failed = True
                  break

          if failed:
              sys.exit(1)

          print('All enrich batches completed successfully')
          PY

      - name: Extract full text for new articles
        if: steps.ingest.outputs.should_enrich == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          ARTICLE_IDS='${{ steps.ingest.outputs.article_ids }}'
          ID_COUNT="$(echo "${ARTICLE_IDS}" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"

          if [ "${ID_COUNT}" -eq 0 ]; then
            echo "No article IDs to extract"
            exit 0
          fi

          echo "Extracting full text for ${ID_COUNT} article(s)"

          ID_CSV="$(echo "${ARTICLE_IDS}" | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)))')"
          python -m workers.news_ingestion.extract_full_text --ids "${ID_CSV}"
          echo "Full text extraction completed"

      - name: Fetch eligible portfolio ids
        if: steps.ingest.outputs.should_enrich == 'true'
        id: analysis_targets
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${CRON_ENDPOINT%/api/news/cron}"
          ANALYSIS_URL="${BASE_URL}/api/analysis/cron"

          echo "Fetching eligible portfolio ids via ${ANALYSIS_URL}"

          response_file="$(mktemp)"

          http_code="$(
            curl -sS \
              -X GET \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Accept: application/json" \
              -o "${response_file}" \
              -w "%{http_code}" \
              "${ANALYSIS_URL}?force=true"
          )"

          echo "HTTP ${http_code}"

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "Analysis target discovery failed"
            error_detail="$(python3 -c 'import json, sys; data = json.load(open(sys.argv[1])); print(data.get("error", "unknown"))' "$response_file" 2>/dev/null || printf '%s' '(non-JSON response)')"
            echo "error: ${error_detail}"
            exit 1
          fi

          portfolio_ids="$(python3 - "$response_file" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          print(json.dumps(data.get("portfolioIds", [])))
          PY
          )"
          has_portfolios="$(python3 - "$response_file" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          print("true" if len(data.get("portfolioIds", [])) > 0 else "false")
          PY
          )"
          skipped_count="$(python3 - "$response_file" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          print(int(data.get("skippedCount", 0)))
          PY
          )"

          echo "Eligible portfolios: $(echo "${portfolio_ids}" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          echo "Skipped by cooldown: ${skipped_count}"

          echo "portfolio_ids=${portfolio_ids}" >> "$GITHUB_OUTPUT"
          echo "has_portfolios=${has_portfolios}" >> "$GITHUB_OUTPUT"

      - name: Run portfolio analysis per portfolio
        if: steps.ingest.outputs.should_enrich == 'true'
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${CRON_ENDPOINT%/api/news/cron}"
          ANALYSIS_URL="${BASE_URL}/api/analysis/cron"
          PORTFOLIO_IDS='${{ steps.analysis_targets.outputs.portfolio_ids }}'

          echo "Running portfolio analysis via ${ANALYSIS_URL}"

          python3 - "$PORTFOLIO_IDS" "$ANALYSIS_URL" <<'PY'
          import json
          import os
          import subprocess
          import sys

          portfolio_ids = json.loads(sys.argv[1])
          analysis_url = sys.argv[2]
          cron_secret = os.environ["CRON_SECRET"]
          print(f'Processing {len(portfolio_ids)} portfolio(s) sequentially')

          for i, portfolio_id in enumerate(portfolio_ids):
              print(f'--- Portfolio {i+1}/{len(portfolio_ids)}: {portfolio_id} ---')
              payload = json.dumps({'portfolioId': portfolio_id, 'force': True})

              result = subprocess.run([
                  'curl', '-sS',
                  '-X', 'POST',
                  '-H', f'Authorization: Bearer {cron_secret}',
                  '-H', 'Content-Type: application/json',
                  '-H', 'Accept: application/json',
                  '-d', payload,
                  '-w', '\n%{http_code}',
                  analysis_url
              ], capture_output=True, text=True, timeout=300)

              lines = result.stdout.strip().rsplit('\n', 1)
              body = lines[0] if len(lines) > 1 else ''
              http_code = lines[-1].strip()

              print(f'HTTP {http_code}')

              if not (200 <= int(http_code) < 300):
                  print(f'Analysis failed for portfolio {portfolio_id} with HTTP {http_code}')
                  sys.exit(1)

              try:
                  resp = json.loads(body)
              except json.JSONDecodeError:
                  print(f'Analysis returned invalid JSON for portfolio {portfolio_id}')
                  sys.exit(1)

              if resp.get('error'):
                  print(f'Analysis returned error for portfolio {portfolio_id}: {resp["error"]}')
                  sys.exit(1)

              if resp.get('skipped'):
                  print(f'Portfolio {portfolio_id} skipped due to cooldown')
              else:
                  print(f'Portfolio {portfolio_id} processed successfully')

          print('All portfolio analyses completed successfully')
          PY
